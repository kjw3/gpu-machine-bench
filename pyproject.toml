[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-machine-bench"
version = "0.1.0"
description = "Repeatable GPU workload measurements for the Decent home lab"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5"]

[project.scripts]
gpu-bench = "gpu_bench.cli:main"

[tool.setuptools.packages.find]
include = ["gpu_bench*"]
